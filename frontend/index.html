<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPS247 - Sistema de Autenticação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #666;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f9fa;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            color: #666;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .form-section {
            display: none;
        }
        
        .form-section.active {
            display: block;
        }
        
        .profile-section {
            display: none;
        }
        
        .profile-section.active {
            display: block;
        }
        
        .profile-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .profile-info h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .profile-info p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .logout-btn {
            background: #dc3545;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>XPS247</h1>
            <p>Sistema de Transferências Internacionais</p>
        </div>
        
        <div id="auth-section">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Login</div>
                <div class="tab" onclick="switchTab('register')">Cadastro</div>
                <div class="tab" onclick="switchTab('complete')">Completar</div>
            </div>
            
            <div id="message"></div>
            
            <!-- Login Form -->
            <div id="login-form" class="form-section active">
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label for="login-username">Username ou Email:</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Senha:</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn">Entrar</button>
                </form>
            </div>
            
            <!-- Register Form -->
            <div id="register-form" class="form-section">
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label for="register-name">Nome Completo:</label>
                        <input type="text" id="register-name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-phone">Telefone:</label>
                        <input type="tel" id="register-phone" required>
                    </div>
                    <div class="form-group">
                        <label for="register-username">Username:</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email (opcional):</label>
                        <input type="email" id="register-email">
                    </div>
                    <button type="submit" class="btn">Cadastrar</button>
                </form>
            </div>
            
            <!-- Complete Registration Form -->
            <div id="complete-form" class="form-section">
                <form onsubmit="completeRegistration(event)">
                    <div class="form-group">
                        <label for="complete-username">Username:</label>
                        <input type="text" id="complete-username" required>
                    </div>
                    <div class="form-group">
                        <label for="complete-email">Email:</label>
                        <input type="email" id="complete-email" required>
                    </div>
                    <div class="form-group">
                        <label for="complete-password">Senha:</label>
                        <input type="password" id="complete-password" required>
                    </div>
                    <button type="submit" class="btn">Completar Cadastro</button>
                </form>
            </div>
        </div>
        
        <!-- Profile Section -->
        <div id="profile-section" class="profile-section">
            <div class="profile-info">
                <h3>Perfil do Cliente</h3>
                <p><strong>Nome:</strong> <span id="profile-name"></span></p>
                <p><strong>Email:</strong> <span id="profile-email"></span></p>
            </div>
            
            <form onsubmit="updateProfile(event)">
                <div class="form-group">
                    <label for="update-name">Nome:</label>
                    <input type="text" id="update-name" required>
                </div>
                <div class="form-group">
                    <label for="update-email">Email:</label>
                    <input type="email" id="update-email" required>
                </div>
                <button type="submit" class="btn">Atualizar Perfil</button>
            </form>
            
            <form onsubmit="changePassword(event)">
                <div class="form-group">
                    <label for="current-password">Senha Atual:</label>
                    <input type="password" id="current-password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Nova Senha:</label>
                    <input type="password" id="new-password" required>
                </div>
                <button type="submit" class="btn">Alterar Senha</button>
            </form>
            
            <button onclick="logout()" class="btn logout-btn">Sair</button>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let authToken = localStorage.getItem('authToken');
        
        // Check if user is already logged in
        if (authToken) {
            loadProfile();
        }
        
        function switchTab(tab) {
            // Remove active class from all tabs and forms
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            
            // Add active class to selected tab and form
            event.target.classList.add('active');
            document.getElementById(tab + '-form').classList.add('active');
            
            // Clear messages
            document.getElementById('message').innerHTML = '';
        }
        
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
        
        async function login(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username_or_email: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    showMessage('Login realizado com sucesso!');
                    setTimeout(() => loadProfile(), 1000);
                } else {
                    showMessage(data.error || 'Erro no login', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            }
        }
        
        async function register(event) {
            event.preventDefault();
            
            const name = document.getElementById('register-name').value;
            const phone = document.getElementById('register-phone').value;
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/register/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        username: username,
                        email: email
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Cadastro inicial realizado! Complete o registro na aba "Completar".');
                    switchTab('complete');
                } else {
                    showMessage(data.error || 'Erro no cadastro', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            }
        }
        
        async function completeRegistration(event) {
            event.preventDefault();
            
            const username = document.getElementById('complete-username').value;
            const email = document.getElementById('complete-email').value;
            const password = document.getElementById('complete-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/complete-registration/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Cadastro completado com sucesso! Faça login.');
                    switchTab('login');
                } else {
                    showMessage(data.error || 'Erro ao completar cadastro', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            }
        }
        
        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}/auth/profile/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('profile-name').textContent = data.name;
                    document.getElementById('profile-email').textContent = data.email || 'Não informado';
                    document.getElementById('update-name').value = data.name;
                    document.getElementById('update-email').value = data.email || '';
                    
                    // Show profile section
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('profile-section').classList.add('active');
                } else {
                    logout();
                }
            } catch (error) {
                showMessage('Erro ao carregar perfil', 'error');
                logout();
            }
        }
        
        async function updateProfile(event) {
            event.preventDefault();
            
            const name = document.getElementById('update-name').value;
            const email = document.getElementById('update-email').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/profile/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Perfil atualizado com sucesso!');
                    loadProfile();
                } else {
                    showMessage(data.error || 'Erro ao atualizar perfil', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            }
        }
        
        async function changePassword(event) {
            event.preventDefault();
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/auth/change-password/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Senha alterada com sucesso!');
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                } else {
                    showMessage(data.error || 'Erro ao alterar senha', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão', 'error');
            }
        }
        
        function logout() {
            authToken = null;
            localStorage.removeItem('authToken');
            
            // Show auth section
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('profile-section').classList.remove('active');
            
            // Clear forms
            document.querySelectorAll('form').forEach(form => form.reset());
            document.getElementById('message').innerHTML = '';
            
            showMessage('Logout realizado com sucesso!');
        }
    </script>
</body>
</html>
